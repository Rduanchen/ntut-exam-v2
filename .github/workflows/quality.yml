name: Quality gates
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: SKIP_DESKTOP=1 bash scripts/check-contract-fixture.sh
      - run: pnpm --filter backend typecheck:test
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter backend exec vitest run --coverage --coverage.include='src/**' --coverage.thresholds.lines=100
      - run: pnpm --filter frontend exec vitest run --coverage --coverage.include='src/**' --coverage.thresholds.lines=100
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --audit-level high
